<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Daze | Scrum Planning Poker</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2e4da8',
            secondary: '#f3f4f6',
            success: '#10b981',
            accent: '#f59e0b'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'custom': '8px',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layouts">.poker-table-gradient {
    background: radial-gradient(circle at center, #fff 0%, #f9fafb 100%);
    border: 8px solid #f1f5f9
    }
.card-back-pattern {
    background-color: #2e4da8;
    background-image: radial-gradient(#ffffff33 1px, transparent 1px), radial-gradient(#ffffff33 1px, transparent 1px);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
    border: 2px solid white
    }
.perspective-card {
    transition: transform 0.2s
    }
.perspective-card:hover {
    transform: translateY(-10px)
    }
/* Simple scrollbar styling for the sidebar */
.custom-scrollbar::-webkit-scrollbar {
    width: 6px
    }
.custom-scrollbar::-webkit-scrollbar-track {
    background: transparent
    }
.custom-scrollbar::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 10px
    }</style>
</head>
<body class="bg-gray-50 font-sans text-slate-800 h-screen overflow-hidden flex flex-col">
<!-- BEGIN: MainHeader -->
<header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between z-10">
<div class="flex items-center space-x-6">
<div class="flex items-center" data-purpose="brand-logo"><img alt="Daze Logo" class="h-6 w-auto" src="{{DATA:IMAGE:IMAGE_6}}"/></div>
<div class="h-6 w-px bg-gray-200"></div>
<div class="flex flex-col">
<h1 class="text-lg font-bold text-gray-900 leading-tight">Sprint 42 Planning</h1>
<button class="text-xs font-medium text-primary hover:underline flex items-center">
<svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
          Share Room Link
        </button>
</div>
</div>
<div class="flex items-center space-x-3">
<button class="px-4 py-2 text-sm font-semibold text-primary bg-white border border-primary rounded-custom hover:bg-blue-50 shadow-sm transition-all">New Round</button>
<button class="px-6 py-2 text-sm font-bold text-white bg-primary rounded-custom hover:opacity-90 shadow-md transition-all">
        Reveal Cards
      </button>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: GameRoomArea -->
<main class="flex-1 flex overflow-hidden">
<!-- BEGIN: TableView -->
<section class="flex-1 relative flex flex-col items-center justify-center p-12 bg-slate-50 overflow-hidden">
<!-- Central Gaming Table -->
<div class="relative w-full max-w-4xl aspect-[2/1] poker-table-gradient rounded-[200px] shadow-2xl flex items-center justify-center border-gray-200">
<!-- Center Logo Overlay -->
<div class="opacity-5 pointer-events-none select-none w-1/2 opacity-10">
<img alt="Daze Watermark" class="w-full h-auto" src="{{DATA:IMAGE:IMAGE_9}}"/>
</div>
<!-- Players around the table -->
<!-- Top Left Player (Voted) -->
<div class="absolute -top-12 left-1/4 flex flex-col items-center">
<div class="w-14 h-14 rounded-full border-4 border-white shadow-lg bg-indigo-100 flex items-center justify-center mb-2 overflow-hidden"><div class="w-full h-full flex items-center justify-center bg-primary text-white font-bold text-xl">A</div></div>
<span class="text-xs font-bold bg-white px-2 py-0.5 rounded shadow">Alex</span>
<div class="mt-4 w-10 h-14 card-back-pattern rounded-md shadow-md animate-bounce"></div>
</div>
<!-- Top Right Player (Thinking) -->
<div class="absolute -top-12 right-1/4 flex flex-col items-center">
<div class="w-14 h-14 rounded-full border-4 border-white shadow-lg bg-pink-100 flex items-center justify-center mb-2 overflow-hidden"><div class="w-full h-full flex items-center justify-center bg-pink-500 text-white font-bold text-xl">S</div></div>
<span class="text-xs font-bold bg-white px-2 py-0.5 rounded shadow">Sofia</span>
<div class="mt-4 flex space-x-1">
<div class="w-2 h-2 bg-gray-300 rounded-full animate-pulse"><div class="w-full h-full flex items-center justify-center bg-pink-500 text-white font-bold text-xl">S</div></div>
<div class="w-2 h-2 bg-gray-300 rounded-full animate-pulse delay-75"><div class="w-full h-full flex items-center justify-center bg-pink-500 text-white font-bold text-xl">S</div></div>
<div class="w-2 h-2 bg-gray-300 rounded-full animate-pulse delay-150"><div class="w-full h-full flex items-center justify-center bg-pink-500 text-white font-bold text-xl">S</div></div>
</div>
</div>
<!-- Right Player (Voted) -->
<div class="absolute -right-20 top-1/2 -translate-y-1/2 flex items-center">
<div class="flex flex-col items-center">
<div class="w-14 h-14 rounded-full border-4 border-white shadow-lg bg-green-100 flex items-center justify-center mb-2 overflow-hidden"><div class="w-full h-full flex items-center justify-center bg-emerald-500 text-white font-bold text-xl">M</div></div>
<span class="text-xs font-bold bg-white px-2 py-0.5 rounded shadow">Marco</span>
</div>
<div class="ml-4 w-10 h-14 card-back-pattern rounded-md shadow-md transform rotate-12"></div>
</div>
<!-- Left Player (Voted) -->
<div class="absolute -left-20 top-1/2 -translate-y-1/2 flex items-center flex-row-reverse">
<div class="flex flex-col items-center">
<div class="w-14 h-14 rounded-full border-4 border-white shadow-lg bg-orange-100 flex items-center justify-center mb-2 overflow-hidden"><div class="w-full h-full flex items-center justify-center bg-orange-500 text-white font-bold text-xl">C</div></div>
<span class="text-xs font-bold bg-white px-2 py-0.5 rounded shadow">Chen</span>
</div>
<div class="mr-4 w-10 h-14 card-back-pattern rounded-md shadow-md transform -rotate-12"></div>
</div>
</div>
<!-- Current Round Status Info -->

</section>
<!-- END: TableView -->
<!-- BEGIN: RightPanel (Issues) -->
<aside class="w-80 bg-white border-l border-gray-200 flex flex-col">
<div class="p-4 border-b border-gray-100 flex items-center justify-between">
<h3 class="font-bold text-gray-900">Connected Participants</h3>
</div>
<div class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-2">
<!-- Online Participants -->
<div class="p-3 bg-white border-b border-gray-50 flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs">A</div>
<span class="text-sm font-medium text-gray-900">Alex (You)</span>
</div>
<span class="w-2.5 h-2.5 rounded-full bg-success"></span>
</div>
<div class="p-3 bg-white border-b border-gray-50 flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-pink-500 text-white flex items-center justify-center font-bold text-xs">S</div>
<span class="text-sm font-medium text-gray-900">Sofia</span>
</div>
<span class="w-2.5 h-2.5 rounded-full bg-success"></span>
</div>
<div class="p-3 bg-white border-b border-gray-50 flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-xs">M</div>
<span class="text-sm font-medium text-gray-900">Marco</span>
</div>
<span class="w-2.5 h-2.5 rounded-full bg-success"></span>
</div>
<div class="p-3 bg-white border-b border-gray-50 flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center font-bold text-xs">C</div>
<span class="text-sm font-medium text-gray-900">Chen</span>
</div>
<span class="w-2.5 h-2.5 rounded-full bg-success"></span>
</div>
<!-- Offline Participants -->
<div class="p-3 bg-white border-b border-gray-50 flex items-center justify-between opacity-60">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-xs">J</div>
<span class="text-sm font-medium text-gray-600">James</span>
</div>
<span class="w-2.5 h-2.5 rounded-full bg-gray-300"></span>
</div>
<div class="p-3 bg-white border-b border-gray-50 flex items-center justify-between opacity-60">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-xs">L</div>
<span class="text-sm font-medium text-gray-600">Lisa</span>
</div>
<span class="w-2.5 h-2.5 rounded-full bg-gray-300"></span>
</div>
</div>
</aside>
<!-- END: RightPanel -->
</main>
<!-- END: GameRoomArea -->
<!-- BEGIN: CardSelectionFooter -->
<footer class="bg-white border-t border-gray-200 p-6 shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">
<div class="max-w-6xl mx-auto flex flex-col items-center">
<p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Choose your card</p>
<div class="flex space-x-3 overflow-x-auto pb-2 w-full justify-center scroll-smooth">
<!-- Fibonacci Cards -->
<button class="perspective-card w-14 h-20 bg-white border-2 border-gray-200 rounded-lg flex items-center justify-center text-xl font-bold text-primary hover:border-primary hover:text-white hover:bg-primary shadow-sm hover:shadow-lg">0</button>
<button class="perspective-card w-14 h-20 bg-white border-2 border-gray-200 rounded-lg flex items-center justify-center text-xl font-bold text-primary hover:border-primary hover:text-white hover:bg-primary shadow-sm hover:shadow-lg">1</button>
<button class="perspective-card w-14 h-20 bg-white border-2 border-gray-200 rounded-lg flex items-center justify-center text-xl font-bold text-primary hover:border-primary hover:text-white hover:bg-primary shadow-sm hover:shadow-lg">2</button>
<button class="perspective-card w-14 h-20 bg-white border-2 border-gray-200 rounded-lg flex items-center justify-center text-xl font-bold text-primary hover:border-primary hover:text-white hover:bg-primary shadow-sm hover:shadow-lg">3</button>
<button class="perspective-card w-14 h-20 bg-primary border-2 border-primary rounded-lg flex items-center justify-center text-xl font-bold text-white shadow-lg ring-4 ring-primary/20 scale-110">5</button>
<button class="perspective-card w-14 h-20 bg-white border-2 border-gray-200 rounded-lg flex items-center justify-center text-xl font-bold text-primary hover:border-primary hover:text-white hover:bg-primary shadow-sm hover:shadow-lg">8</button>
<button class="perspective-card w-14 h-20 bg-white border-2 border-gray-200 rounded-lg flex items-center justify-center text-xl font-bold text-primary hover:border-primary hover:text-white hover:bg-primary shadow-sm hover:shadow-lg">13</button>
<button class="perspective-card w-14 h-20 bg-white border-2 border-gray-200 rounded-lg flex items-center justify-center text-xl font-bold text-primary hover:border-primary hover:text-white hover:bg-primary shadow-sm hover:shadow-lg">21</button>
<button class="perspective-card w-14 h-20 bg-white border-2 border-gray-200 rounded-lg flex items-center justify-center text-xl font-bold text-primary hover:border-primary hover:text-white hover:bg-primary shadow-sm hover:shadow-lg">?</button>
<button class="perspective-card w-14 h-20 bg-white border-2 border-gray-200 rounded-lg flex items-center justify-center text-xl font-bold text-primary hover:border-primary hover:text-white hover:bg-primary shadow-sm hover:shadow-lg">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</div>
</div>
</footer>
<!-- END: CardSelectionFooter -->
</body></html>
